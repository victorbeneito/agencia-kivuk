# Override de producción (VPS). No sustituye al compose base: se suma a él.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# El compose base sigue sirviendo tal cual para desarrollo local. Todo lo que
# solo tiene sentido en el servidor vive aquí: cerrar los puertos al exterior,
# la clave de cifrado y Caddy con HTTPS automático.

services:
  n8n:
    ports: !override []          # a internet solo asoma Caddy
    environment:
      # Clave con la que n8n cifra credenciales. Fijarla explícitamente (en vez
      # de dejar que se autogenere en el volumen) permite recrear el servidor
      # sin perder acceso a lo ya guardado.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PROXY_HOPS: "1"        # n8n está detrás de un proxy inverso
      N8N_RUNNERS_ENABLED: "true"
      # Secreto compartido con el panel para el webhook de envío de WhatsApp.
      # Ese webhook manda mensajes en nombre del negocio: sin él, cualquiera que
      # dé con la URL puede escribir a los clientes del cliente.
      PANEL_WEBHOOK_TOKEN: ${PANEL_WEBHOOK_TOKEN}

  render:
    ports: !override []          # solo accesible desde la red de Docker

  # Panel de administración (Next.js). Vive aquí y no en Vercel porque necesita
  # hablar con `render`, que no está expuesto a internet: desde esta misma red
  # de Docker le llega por `http://render:3001` sin abrir ningún puerto.
  panel:
    build:
      context: ../app
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # Las NEXT_PUBLIC_ se incrustan al compilar la imagen, no al arrancarla:
        # si cambia, hay que reconstruir con `--build`, no basta con reiniciar.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        # WhatsApp de la agencia, el botón principal de la web corporativa.
        # Vacío mientras no exista el bot propio: los botones caen entonces al
        # formulario de contacto.
        NEXT_PUBLIC_KIVUK_WHATSAPP: ${NEXT_PUBLIC_KIVUK_WHATSAPP:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Nombres de servicio de Docker, no el dominio público: la llamada no sale
      # a internet ni pasa por Caddy.
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      RENDER_BASE_URL: http://render:3001
      # El otro extremo del secreto de arriba. Vale también para el endpoint de
      # notificaciones push, que llama n8n.
      N8N_WEBHOOK_TOKEN: ${PANEL_WEBHOOK_TOKEN}
      # Notificaciones push (Web Push / VAPID). La pública se incrusta al
      # compilar porque el navegador la necesita para suscribirse; la privada
      # firma los envíos y no sale de aquí.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:info@agenciakivuk.com}
      # Envío de facturas por correo. Es la cuenta de Resend de la AGENCIA
      # (dominio agenciakivuk.com), no la del cliente que usan los avisos: en una
      # factura quien escribe eres tú, no su negocio. Sin estas dos, el botón de
      # enviar avisa en pantalla en vez de fallar en silencio.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FACTURAS_REMITENTE: ${FACTURAS_REMITENTE:-}
      # Formulario de contacto de la web corporativa. Reusa la misma cuenta de
      # Resend; si se dejan vacías, escribe a info@agenciakivuk.com desde el
      # remitente de facturación.
      CONTACTO_DESTINATARIO: ${CONTACTO_DESTINATARIO:-}
      CONTACTO_REMITENTE: ${CONTACTO_REMITENTE:-}
    depends_on:
      - n8n
      - render

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - panel

volumes:
  caddy_data:
  caddy_config:
